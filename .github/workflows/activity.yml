name: Refresh the activity on the org page
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rewrite the releases and activity sections
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/update_activity.py
      - name: Commit when something changed
        run: |
          git config user.name "zimamlabs"
          git config user.email "noreply@github.com"
          git add profile/README.md
          git diff --cached --quiet || (git commit -m "docs: refresh releases and activity" && git push)
